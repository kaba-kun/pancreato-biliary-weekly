name: Weekly Pancreatobiliary Digest & Web Publish

on:
  schedule:
    # 毎週日曜日 21:00 JST (12:00 UTC) に自動実行
    - cron: '0 12 * * 0'
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 論文収集・HTML生成・アーカイブの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: 生成されたWebページおよび過去アーカイブのGitHubコミット＆Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update weekly digest & archives [skip ci]" && git push)
