name: Weekly Pancreatobiliary Digest & Web Publish

on:
  schedule:
    # 毎週日曜日 21:00 JST (12:00 UTC) に自動実行
    - cron: '0 12 * * 0'
  workflow_dispatch: # GitHubの管理画面から「手動実行」できるボタンを有効化

permissions:
  contents: write # 処理結果をリポジトリに保存（Commit/Push）するために必要

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 論文収集・HTML生成・メール送信の実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py

      - name: 生成されたWebページのGitHubへのコミット＆Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add docs/index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update weekly highlight (${{ list }})" && git push)
