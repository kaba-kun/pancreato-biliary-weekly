name: Weekly Pancreatobiliary Digest Update

on:
  schedule:
    # 日本時間 毎週日曜日 午前5:00 (UTC 毎週土曜日 20:00) に自動実行
    - cron: '0 20 * * 6'
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      # エラー発生時に15分（900秒）空けて最大3回まで自動再試行
      - name: Run main.py with auto-retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 900
          command: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weekly digest" && git push)
